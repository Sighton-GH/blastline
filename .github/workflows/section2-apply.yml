name: Section 2 apply staged squad patch

on:
  push:
    branches:
      - section-02-player-squad

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged game patch
        run: patch --batch -p1 < .section2/game.patch
      - name: Validate Section 2 code
        run: |
          npm test
          node --check src/game.js
          node --check src/core.mjs
      - name: Commit applied patch and remove staging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game.js
          git rm .section2/game.patch .github/workflows/section2-apply.yml
          git commit -m "Section 2: implement player squad presentation"
          git push origin HEAD:section-02-player-squad
