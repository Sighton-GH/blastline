name: Section 4 baseline recovery and capture

on:
  push:
    branches: [section-04-enemies-combat]

permissions:
  contents: write

jobs:
  recover-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply only the missing validated Section 3 game changes
        shell: bash
        run: |
          cat > /tmp/recover.py <<'PY'
          from pathlib import Path
          p=Path('src/game.js')
          s=p.read_text()

          replacements=[
            ("gates.push({x:leftX, y:-0.06, w:0.44, h:0.14, kind:pair[0].kind, value:pair[0].value, label:pair[0].label, color: gateText(pair[0]).startsWith('-') ? 'red' : 'blue'});",
             "gates.push({x:leftX, y:-0.06, w:0.68, h:0.14, kind:pair[0].kind, value:pair[0].value, label:pair[0].label, color: gateText(pair[0]).startsWith('-') ? 'red' : 'blue'});"),
            ("gates.push({x:rightX, y:-0.06, w:0.44, h:0.14, kind:pair[1].kind, value:pair[1].value, label:pair[1].label, color: gateText(pair[1]).startsWith('-') ? 'red' : 'blue'});",
             "gates.push({x:rightX, y:-0.06, w:0.68, h:0.14, kind:pair[1].kind, value:pair[1].value, label:pair[1].label, color: gateText(pair[1]).startsWith('-') ? 'red' : 'blue'});"),
            ("gates = gates.filter(g => g.y < 1.08 && !g.hit);","gates = gates.filter(g => g.y < 1.03);"),
            ("drawBackground(); drawGates(); drawEnemies(); drawBullets(); drawPlayer(); drawEffects();","drawBackground(); drawGates(); drawEnemies(); drawBullets(); drawPlayer(); drawGateForeground(); drawEffects();"),
          ]
          for old,new in replacements:
            assert old in s, f'missing exact baseline text: {old[:80]}'
            s=s.replace(old,new,1)

          start=s.index('function drawGates(){')
          end=s.index('function drawEnemies(){',start)
          gate_block=r'''function gateVisual(gate){
            const center=worldToScreen(gate.x,gate.y);
            const left=worldToScreen(gate.x-gate.w/2,gate.y);
            const right=worldToScreen(gate.x+gate.w/2,gate.y);
            const panelW=Math.max(18,right.x-left.x);
            const depth=clamp((gate.y+.04)/1.04,0,1);
            const panelH=Math.min(H*.086,Math.max(18,panelW*.62));
            const frameH=panelH*1.34;
            const deckY=center.y;
            const topY=deckY-frameH;
            const panelTop=topY+frameH*.13;
            const panelBottom=deckY-frameH*.12;
            const postW=clamp(panelW*.085,6,17);
            const railH=clamp(panelH*.125,4,11);
            const extrusion=clamp(lerp(1.4,6.5,Math.pow(depth,.8)),1.4,7);
            const fade=gate.hit?clamp((1.03-gate.y)/.18,0,1):1;
            return {center,left,right,panelW,panelH,frameH,deckY,topY,panelTop,panelBottom,postW,railH,extrusion,depth,fade};
          }

          function drawGateBody(gate){
            const g=gateVisual(gate);
            if(g.fade<=0)return;
            const isRed=gate.color==='red';
            const main=isRed?'#f14549':'#168ee8';
            const bright=isRed?'#ff6d68':'#37c7ff';
            const dark=isRed?'#921d27':'#07538f';
            const deep=isRed?'#651620':'#06365e';
            const fillA=isRed?'rgba(241,54,63,.72)':'rgba(15,151,235,.72)';
            const fillB=isRed?'rgba(255,112,104,.48)':'rgba(62,207,255,.46)';
            const glow=isRed?'rgba(255,67,72,.38)':'rgba(37,196,255,.40)';
            const x0=g.left.x,x1=g.right.x;
            const panelY=g.panelTop,panelH=g.panelBottom-g.panelTop;
            ctx.save();ctx.globalAlpha=g.fade;

            // Small deck-mounted feet make the portal read as physical structure rather than a floating HUD panel.
            for(const x of [x0,x1]){
              ctx.fillStyle='rgba(36,43,48,.34)';
              ctx.beginPath();ctx.ellipse(x,g.deckY+g.railH*.46,g.postW*.86,g.railH*.52,0,0,Math.PI*2);ctx.fill();
              ctx.fillStyle=deep;
              ctx.beginPath();ctx.roundRect(x-g.postW*.78,g.deckY-g.railH*.12,g.postW*1.56,g.railH*.72,g.railH*.18);ctx.fill();
            }

            // Dark extruded side/back faces give the frame actual thickness in the accepted road perspective.
            ctx.fillStyle=deep;
            ctx.beginPath();ctx.moveTo(x0-g.postW*.55,g.topY+g.extrusion);ctx.lineTo(x0+g.postW*.55,g.topY);ctx.lineTo(x0+g.postW*.55,g.deckY);ctx.lineTo(x0-g.postW*.55,g.deckY+g.extrusion);ctx.closePath();ctx.fill();
            ctx.beginPath();ctx.moveTo(x1-g.postW*.55,g.topY);ctx.lineTo(x1+g.postW*.55,g.topY+g.extrusion);ctx.lineTo(x1+g.postW*.55,g.deckY+g.extrusion);ctx.lineTo(x1-g.postW*.55,g.deckY);ctx.closePath();ctx.fill();

            // Coloured translucent energy plane, kept inside the physical posts/rails.
            ctx.shadowColor=glow;ctx.shadowBlur=Math.min(12,lerp(3,10,g.depth));
            const fill=ctx.createLinearGradient(0,panelY,0,g.panelBottom);
            fill.addColorStop(0,fillA);fill.addColorStop(.48,fillB);fill.addColorStop(1,fillA);
            ctx.fillStyle=fill;
            ctx.fillRect(x0+g.postW*.48,panelY,x1-x0-g.postW*.96,panelH);
            ctx.shadowBlur=0;
            const shine=ctx.createLinearGradient(x0,0,x1,0);
            shine.addColorStop(0,'rgba(255,255,255,.10)');shine.addColorStop(.48,'rgba(255,255,255,.25)');shine.addColorStop(1,'rgba(255,255,255,.08)');
            ctx.fillStyle=shine;ctx.fillRect(x0+g.postW*.8,panelY+g.railH*.65,x1-x0-g.postW*1.6,Math.max(1.2,g.railH*.18));

            // Uprights and top/bottom structural rails.
            for(const x of [x0,x1]){
              const pg=ctx.createLinearGradient(x-g.postW/2,0,x+g.postW/2,0);
              pg.addColorStop(0,dark);pg.addColorStop(.38,main);pg.addColorStop(.68,bright);pg.addColorStop(1,dark);
              ctx.fillStyle=pg;ctx.beginPath();ctx.roundRect(x-g.postW/2,g.topY,g.postW,g.frameH,g.postW*.22);ctx.fill();
              ctx.fillStyle='rgba(255,255,255,.46)';ctx.fillRect(x-g.postW*.20,g.topY+g.railH*.55,Math.max(1,g.postW*.14),g.frameH*.67);
            }
            ctx.fillStyle=dark;ctx.fillRect(x0-g.postW*.22,g.topY,x1-x0+g.postW*.44,g.railH);
            ctx.fillStyle=main;ctx.fillRect(x0,g.topY,x1-x0,g.railH*.62);
            ctx.fillStyle=dark;ctx.fillRect(x0+g.postW*.15,g.panelBottom-g.railH*.42,x1-x0-g.postW*.30,g.railH*.78);
            ctx.fillStyle=bright;ctx.globalAlpha=g.fade*.72;ctx.fillRect(x0+g.postW*.32,g.topY+g.railH*.16,x1-x0-g.postW*.64,Math.max(1,g.railH*.16));ctx.globalAlpha=g.fade;

            // Operator is optically centered inside the energy plane, not floating over an arbitrary screen rectangle.
            const text=gateText(gate);
            let fontSize=clamp(panelH*.48,11,38);
            const textWidthLimit=Math.max(24,g.panelW-g.postW*2.35);
            ctx.font=`950 ${fontSize}px system-ui`;
            while(fontSize>10&&ctx.measureText(text).width>textWidthLimit){fontSize-=1;ctx.font=`950 ${fontSize}px system-ui`;}
            ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.lineJoin='round';ctx.lineWidth=clamp(fontSize*.15,2,5);ctx.strokeStyle='rgba(22,28,35,.72)';ctx.fillStyle='#fff';
            const textY=panelY+panelH*.53;
            ctx.strokeText(text,g.center.x,textY);ctx.fillText(text,g.center.x,textY);
            ctx.restore();
          }

          function drawGateForeground(){
            // Once a gate reaches the squad, redraw only its physical frame. The translucent plane remains behind the troops,
            // while posts/crossbar can occlude them, which reads like running through a portal instead of a flat overlay.
            for(const gate of gates){
              if(gate.y<.77||gate.y>.98)continue;
              const g=gateVisual(gate);if(g.fade<=0)continue;
              const isRed=gate.color==='red',main=isRed?'#f14549':'#168ee8',dark=isRed?'#921d27':'#07538f';
              ctx.save();ctx.globalAlpha=g.fade*.94;
              for(const x of [g.left.x,g.right.x]){ctx.fillStyle=dark;ctx.beginPath();ctx.roundRect(x-g.postW/2,g.topY,g.postW,g.frameH,g.postW*.22);ctx.fill();ctx.fillStyle=main;ctx.fillRect(x-g.postW*.23,g.topY+g.railH*.6,g.postW*.46,g.frameH*.63);}
              ctx.fillStyle=dark;ctx.fillRect(g.left.x-g.postW*.22,g.topY,g.right.x-g.left.x+g.postW*.44,g.railH);
              ctx.fillStyle=main;ctx.fillRect(g.left.x,g.topY,g.right.x-g.left.x,g.railH*.58);
              ctx.restore();
            }
          }

          function drawGates(){
            const ordered=[...gates].sort((a,b)=>a.y-b.y);
            for(const gate of ordered)drawGateBody(gate);
          }
          '''
          s=s[:start]+gate_block+s[end:]

          helper_anchor="    setPower(value){player.power=Math.max(1,Number(value)||1);updateHud();},\n"
          helper_add="""    setPower(value){player.power=Math.max(1,Number(value)||1);updateHud();},
              setPlayerX(value){player.x=player.targetX=clamp(Number(value)||0,-.78,.78);updateHud();return player.x;},
              setWaveTime(value){waveTime=Math.max(0,Number(value)||0);return waveTime;},
              setGatePair(left,right,y=.52){
                const specs=[left,right],xs=[-.35,.35];
                gates=specs.map((spec,i)=>({x:xs[i],y,w:.68,h:.14,kind:spec.kind,value:spec.value,label:()=>spec.text,color:spec.color||(String(spec.text).startsWith('-')?'red':'blue'),hit:false}));
                return gates.map(g=>({kind:g.kind,value:g.value,text:gateText(g),color:g.color}));
              },
          """
          assert helper_anchor in s
          s=s.replace(helper_anchor,helper_add,1)
          old_state="    getState(){return {state,paused,wave:wave+1,troops:player.troops,visibleSquad:visibleSquadCount(player.troops),playerX:player.x,bullets:bullets.length,sampleBullet:bullets[0]?{x:bullets[0].x,y:bullets[0].y,targetX:bullets[0].targetX,shooter:bullets[0].shooter}:null,enemies:enemies.length,gates:gates.map(g=>({x:g.x,y:g.y,kind:g.kind,value:g.value,hit:!!g.hit})),muzzleFlashes:muzzleFlashes.length,boss:boss?{x:boss.x,y:boss.y,hp:boss.hp}:null};}"
          new_state="    getState(){return {state,paused,wave:wave+1,troops:player.troops,power:player.power,fireRate:player.fireRate,visibleSquad:visibleSquadCount(player.troops),playerX:player.x,bullets:bullets.length,sampleBullet:bullets[0]?{x:bullets[0].x,y:bullets[0].y,targetX:bullets[0].targetX,shooter:bullets[0].shooter}:null,enemies:enemies.length,gates:gates.map(g=>({x:g.x,y:g.y,w:g.w,kind:g.kind,value:g.value,text:gateText(g),color:g.color,hit:!!g.hit})),muzzleFlashes:muzzleFlashes.length,boss:boss?{x:boss.x,y:boss.y,hp:boss.hp}:null};}"
          assert old_state in s
          s=s.replace(old_state,new_state,1)
          p.write_text(s)
          PY
          python3 /tmp/recover.py
          grep -q 'w:0.68' src/game.js
          grep -q 'function gateVisual' src/game.js
          grep -q 'function drawGateForeground' src/game.js
          grep -q 'drawPlayer(); drawGateForeground();' src/game.js
      - name: Static validation after Section 3 recovery
        run: |
          npm test
          node --check src/game.js
          node --check src/core.mjs
      - name: Install Chromium automation
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve game
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/blastline-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .2; done
          cat /tmp/blastline-http.log
          exit 1
      - name: Capture genuine Chromium baseline evidence
        shell: bash
        run: |
          mkdir -p docs/visual-audit/section-04
          cat > /tmp/capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const errors=[];
          async function open(width,height,seed=7){
            const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:1});
            const page=await context.newPage();
            page.on('console',m=>{if(m.type()==='error')errors.push(`console: ${m.text()}`)});
            page.on('pageerror',e=>errors.push(`page: ${e.message}`));
            await page.addInitScript(seed=>{Date.now=()=>seed;},seed);
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await page.click('#playBtn');
            await page.waitForFunction(()=>globalThis.__blastlineTest?.getState().state==='playing');
            return {context,page};
          }
          {
            const {context,page}=await open(390,844,7);
            await page.evaluate(()=>{globalThis.__blastlineTest.setTroops(20);globalThis.__blastlineTest.setGatePair({kind:'troopsMul',value:2,text:'x2',color:'blue'},{kind:'troops',value:-8,text:'-8',color:'red'},.62);});
            await page.keyboard.press('p');
            await page.waitForTimeout(100);
            await page.screenshot({path:'docs/visual-audit/section-04/recovery-section03-mobile.png'});
            await context.close();
          }
          {
            const {context,page}=await open(390,844,7);
            await page.waitForTimeout(3500);
            await page.screenshot({path:'docs/visual-audit/section-04/before-mobile.png'});
            await page.waitForTimeout(1200);
            await page.screenshot({path:'docs/visual-audit/section-04/before-combat-close-mobile.png'});
            const state=await page.evaluate(()=>globalThis.__blastlineTest.getState());
            fs.writeFileSync('/tmp/mobile-state.json',JSON.stringify(state,null,2));
            await context.close();
          }
          {
            const {context,page}=await open(1365,768,7);
            await page.waitForTimeout(3500);
            await page.screenshot({path:'docs/visual-audit/section-04/before-desktop.png'});
            const state=await page.evaluate(()=>globalThis.__blastlineTest.getState());
            fs.writeFileSync('/tmp/desktop-state.json',JSON.stringify(state,null,2));
            await context.close();
          }
          await browser.close();
          const result={errors,mobile:JSON.parse(fs.readFileSync('/tmp/mobile-state.json')),desktop:JSON.parse(fs.readFileSync('/tmp/desktop-state.json'))};
          fs.writeFileSync('docs/visual-audit/section-04/baseline-runtime.json',JSON.stringify(result,null,2));
          if(errors.length) throw new Error(errors.join('\n'));
          JS
          node /tmp/capture.mjs
      - name: Commit recovered baseline and BEFORE evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game.js docs/visual-audit/section-04
          git commit -m 'Recover validated Section 3 baseline and capture Section 4 before evidence'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: section04-baseline-evidence
          path: docs/visual-audit/section-04
