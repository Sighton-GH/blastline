name: Section 4 silhouette capture
on:
  push:
    branches: [section-04-enemies-combat]
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          npm test
          node --check src/game.js
          node --check src/core.mjs
          node --check src/enemy-render.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve and capture
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .2; done
          mkdir -p /tmp/section04-silhouette
          cat > .capture.mjs <<'JS'
          import {chromium} from 'playwright';import fs from 'node:fs';
          const browser=await chromium.launch({headless:true}),errors=[];
          async function open(w,h){const c=await browser.newContext({viewport:{width:w,height:h},deviceScaleFactor:1});const p=await c.newPage();p.on('console',m=>{if(m.type()==='error')errors.push(`console:${m.text()}`)});p.on('pageerror',e=>errors.push(`page:${e.message}`));await p.addInitScript(()=>{Date.now=()=>7});await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});await p.click('#playBtn');await p.waitForFunction(()=>globalThis.__blastlineTest?.getState().state==='playing');return{c,p}}
          {const{c,p}=await open(390,844);await p.waitForTimeout(3500);await p.screenshot({path:'/tmp/section04-silhouette/mobile.png'});await p.waitForTimeout(1800);await p.screenshot({path:'/tmp/section04-silhouette/close-mobile.png'});await p.waitForTimeout(2200);await p.screenshot({path:'/tmp/section04-silhouette/dense-mobile.png'});await c.close()}
          {const{c,p}=await open(1365,768);await p.waitForTimeout(3500);await p.screenshot({path:'/tmp/section04-silhouette/desktop.png'});await c.close()}
          await browser.close();fs.writeFileSync('/tmp/section04-silhouette/errors.json',JSON.stringify(errors,null,2));if(errors.length)throw new Error(errors.join('\n'));
          JS
          node .capture.mjs
          rm .capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: section04-silhouette-evidence
          path: /tmp/section04-silhouette
