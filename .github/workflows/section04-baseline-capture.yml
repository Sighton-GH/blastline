name: Section 4 combat feedback patches
on:
  push:
    branches: [section-04-enemies-combat]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed patches when needed
        shell: bash
        run: |
          if ! grep -q "deathLife" src/game.js; then
            git apply --check tools/section04-pass01.patch
            git apply tools/section04-pass01.patch
          fi
          if ! grep -q "drawBossFigure" src/game.js; then
            git apply --check tools/section04-pass02.patch
            git apply tools/section04-pass02.patch
          fi
      - name: Validate
        run: |
          npm test
          node --check src/game.js
          node --check src/core.mjs
          node --check src/enemy-render.mjs
      - name: Commit when changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game.js
          if ! git diff --cached --quiet; then
            git commit -m 'Add enemy hit death and boss presentation'
            git push
          fi
