      - name: Install Chromium automation
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve game
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/blastline-http.log 2>&1 &
          echo $! >/tmp/blastline-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .2; done
          cat /tmp/blastline-http.log
          exit 1
      - name: Capture genuine Chromium baseline evidence
        shell: bash
        run: |
          mkdir -p docs/visual-audit/section-04
