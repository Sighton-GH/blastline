name: Section 4 source staging
on:
  push:
    branches: [section-04-enemies-combat]
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: section04-source
          path: |
            src
            package.json
            tests
