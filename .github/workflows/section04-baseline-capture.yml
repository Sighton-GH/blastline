            await page.keyboard.press('p');
            await page.waitForTimeout(100);
            await page.screenshot({path:'docs/visual-audit/section-04/recovery-section03-mobile.png'});
            await context.close();
          }
          {
            const {context,page}=await open(390,844,7);
            await page.waitForTimeout(3500);
            await page.screenshot({path:'docs/visual-audit/section-04/before-mobile.png'});
            await page.waitForTimeout(1200);
            await page.screenshot({path:'docs/visual-audit/section-04/before-combat-close-mobile.png'});
            const state=await page.evaluate(()=>globalThis.__blastlineTest.getState());
            fs.writeFileSync('/tmp/mobile-state.json',JSON.stringify(state,null,2));
            await context.close();
          }
          {
            const {context,page}=await open(1365,768,7);
            await page.waitForTimeout(3500);
            await page.screenshot({path:'docs/visual-audit/section-04/before-desktop.png'});
            const state=await page.evaluate(()=>globalThis.__blastlineTest.getState());
            fs.writeFileSync('/tmp/desktop-state.json',JSON.stringify(state,null,2));
            await context.close();
          }
          await browser.close();
          const result={errors,mobile:JSON.parse(fs.readFileSync('/tmp/mobile-state.json')),desktop:JSON.parse(fs.readFileSync('/tmp/desktop-state.json'))};
          fs.writeFileSync('docs/visual-audit/section-04/baseline-runtime.json',JSON.stringify(result,null,2));
          if(errors.length) throw new Error(errors.join('\n'));
          JS
          node /tmp/capture.mjs
