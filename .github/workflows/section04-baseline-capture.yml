name: Batch 12 fidelity validation
on:
  push:
    branches: [batch-12-full-fidelity]
    paths: ['tools/batch12-run-trigger.txt']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending Batch 12 source transform
        run: |
          if [ -f tools/batch12-transform.mjs ]; then node tools/batch12-transform.mjs; fi
      - name: Required validation
        run: |
          npm test
          node --check src/game.js
          node --check src/core.mjs
          node --check src/enemy-render.mjs
          node --check src/production-render.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve and capture real production game
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .2; done
          node tools/batch12-final-capture.mjs
      - name: Commit implementation and genuine screenshot evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src index.html styles.css docs/visual-audit/full-fidelity tools/batch12-transform.mjs tools/batch12-final-capture.mjs
          git diff --cached --quiet || git commit -m 'Integrate Batch 12 visual fidelity pass'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: batch12-fidelity-evidence
          path: |
            docs/visual-audit/full-fidelity
            docs/art-reference
