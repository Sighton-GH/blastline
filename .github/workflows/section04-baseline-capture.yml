name: Batch 12 baseline screenshots
on:
  push:
    branches: [batch-12-full-fidelity]
    paths-ignore: ['docs/visual-audit/**']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Required validation
        run: |
          npm test
          node --check src/game.js
          node --check src/core.mjs
          node --check src/enemy-render.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve and capture real production game
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .2; done
          node tools/section04-final-capture.mjs
          mkdir -p docs/visual-audit/full-fidelity/baseline
          cp docs/visual-audit/section-04/after-mobile.png docs/visual-audit/full-fidelity/baseline/gameplay-mobile.png
          cp docs/visual-audit/section-04/after-desktop.png docs/visual-audit/full-fidelity/baseline/gameplay-desktop.png
          cp docs/visual-audit/section-04/after-elite-mobile.png docs/visual-audit/full-fidelity/baseline/elite-mobile.png
          cp docs/visual-audit/section-04/after-dense-mobile.png docs/visual-audit/full-fidelity/baseline/dense-mobile.png
          cp docs/visual-audit/section-04/after-boss-mobile.png docs/visual-audit/full-fidelity/baseline/boss-mobile.png
          cp docs/visual-audit/section-04/final-capture.json docs/visual-audit/full-fidelity/baseline/capture.json
      - name: Commit real screenshot evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/visual-audit/full-fidelity/baseline docs/visual-audit/section-04
          git diff --cached --quiet || git commit -m 'Capture Batch 12 baseline real screenshots'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: batch12-baseline-screenshots
          path: docs/visual-audit/full-fidelity/baseline
