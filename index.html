<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>BLASTLINE</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <header id="hud" class="panel hidden">
      <div class="hud-left">
        <img id="portrait" src="assets/portrait.webp" alt="Commander portrait" />
        <div class="chips">
          <div class="chip coin"><span class="icon">🪙</span><b id="coinLabel">0</b><span class="plus">+</span></div>
          <div class="chip gem"><span class="icon">💎</span><b id="gemLabel">0</b><span class="plus">+</span></div>
        </div>
      </div>
      <div class="hud-right">
        <div class="wave-pill"><span id="waveLabel">WAVE 1/6</span></div>
        <button id="pauseBtn" class="icon-btn" aria-label="Pause">❚❚</button>
      </div>
    </header>

    <div id="floatingStats" class="panel hidden">
      <div class="stat"><span>TROOPS</span><b id="troopsLabel">12</b></div>
      <div class="stat"><span>POWER</span><b id="powerLabel">1</b></div>
      <div class="stat"><span>BEST</span><b id="bestLabel">0</b></div>
    </div>

    <section id="menu" class="overlay visible">
      <div class="card hero-card">
        <p class="eyebrow">THE REAL GATE RUNNER</p>
        <h1>BLASTLINE</h1>
        <p class="sub">Choose a lane, grow your army, blast through enemy waves, and beat the boss bridge by bridge.</p>
        <div class="controls">
          <span>Move: drag, mouse, A/D, ←/→</span>
          <span>Shoot: automatic</span>
        </div>
        <button id="playBtn" class="primary">PLAY NOW</button>
      </div>
    </section>

    <section id="upgradePanel" class="overlay">
      <div class="card">
        <p class="eyebrow">WAVE CLEAR</p>
        <h2>Pick your upgrade</h2>
        <div id="upgradeCards" class="upgrade-grid"></div>
      </div>
    </section>

    <section id="gameOverPanel" class="overlay">
      <div class="card">
        <p class="eyebrow">MISSION ENDED</p>
        <h2>Bridge lost</h2>
        <div class="results">
          <div><span>Coins</span><b id="finalScore">0</b></div>
          <div><span>Wave</span><b id="finalWave">1</b></div>
          <div><span>Best</span><b id="finalBest">0</b></div>
        </div>
        <button id="retryBtn" class="primary">RUN IT BACK</button>
      </div>
    </section>
  </div>

  <script type="module" src="src/game.js"></script>
</body>
</html>
